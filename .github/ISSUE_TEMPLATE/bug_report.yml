name: Bug report
description: Something in Holt does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please check that this is not already reported, and fill in as much as you can.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what happened instead.
      placeholder: |
        1. Open a workspace with...
        2. Click...
        3. Expected..., got...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Holt version
      description: Shown in Holt → About Holt.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: osversion
    attributes:
      label: OS version
      placeholder: "macOS 15.2 (24C101), Ubuntu 24.04, Windows 11 23H2..."
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        From About → Open Logs Folder: `workbench.log`, and `crash-*.log` if there is one. Paste the last lines
        (remove anything private first).
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Screenshots of the window help a lot.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
