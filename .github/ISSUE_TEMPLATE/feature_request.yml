name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the problem before the solution — what is painful today?
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The workflow that is slow or awkward today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior you want. Sketches or mockups are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you thought about.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - File tree
        - Editor
        - Git
        - Terminal
        - Search
        - Settings / appearance
        - Platform support
        - Other
