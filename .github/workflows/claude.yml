# 在 issue / PR 的评论里写 @claude，Claude 读代码、回答、改代码（推分支、开 PR）。
# 只有仓库的 owner、成员、协作者写的才启动（下面的 if；陌生人的评论连机器都不开），claude-code-action 还会再查写权限。用 Anthropic API，密钥在仓库的 Secret ANTHROPIC_API_KEY。
# 跑在 macOS 上：Grove 只能在 macOS 上编译和测试，Claude 改完可以自己 go vet / go test。
# 这类事件只认默认分支上的这份文件，改了要合进 main 才生效。
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

env:
  GOTOOLCHAIN: auto # go.mod 要 go 1.27.3

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # 读 PR 上 CI 的结果
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --max-turns 限每次来回的轮数，防止跑飞；花费上限在 console.anthropic.com 设
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(go:*),Bash(gofmt:*),Bash(git:*)"
